services:
  - type: web
    name: creativeforge-api
    runtime: docker
    plan: free
    region: singapore
    branch: zhangmingyang
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: STUDIO_RATE_LIMIT
        value: "120"
      - key: STUDIO_CORS_ORIGINS
        sync: false
      # 百炼凭证：值需在 Render Dashboard 的 Environment 中填写（不入库）
      # 后端 model_service 检测到该变量会自动启用 AI 管线
      - key: DASHSCOPE_API_KEY
        sync: false
      # 七牛对象存储：容器无持久盘，产物与历史索引靠这些变量回落到云端。
      # 四项都在 Render Dashboard 填写，缺失时 artifact_store 自动 no-op。
      - key: QINIU_ACCESS_KEY
        sync: false
      - key: QINIU_SECRET_KEY
        sync: false
      - key: QINIU_BUCKET_NAME
        sync: false
      - key: QINIU_REGION
        value: cn-east-1
