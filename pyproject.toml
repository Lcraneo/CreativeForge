[tool.ruff]
line-length = 100
target-version = "py311"
# 遗留双系统（backend/、frontend/）已于 2026-10-05 删除；临时目录跳过
extend-exclude = [".zcode_tmp"]

[tool.ruff.lint]
# Q1 基线：pyflakes 错误 + import 排序 + pycodestyle 警告；
# B/UP（bugbear、pyupgrade）计划 Q2 引入，避免一次性改动面过大
select = ["E4", "E7", "E9", "F", "I", "W"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "^\\.zcode_tmp/"
