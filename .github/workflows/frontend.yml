name: frontend

on:
  push:
    branches: [master]
  pull_request:

defaults:
  run:
    working-directory: studio/frontend

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Unit tests (vitest)
        shell: bash
        run: set -o pipefail; npm run test | tee vitest.log

      - name: Build (tsc -b && vite build)
        run: npm run build

      - name: Release gate L5 (frontend)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: set -o pipefail; python3 tests/release/run_release_tests.py L5 | tee studio/frontend/release_l5.log

      - name: Gate summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Frontend quality gates"
            grep -h "Test Files" vitest.log 2>/dev/null || true
            grep -h "release checks," release_l5.log 2>/dev/null || true
            grep -h "entry gzip" release_l5.log 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Chunk size summary
        run: |
          echo "## JS bundle sizes (top 15)" >> $GITHUB_STEP_SUMMARY
          du -k dist/assets/*.js | sort -rn | head -15 >> $GITHUB_STEP_SUMMARY

  lighthouse:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # 静态托管 dist（API 未启动：页面走空态/错误 toast，不影响 LCP/CLS/TBT 度量）
      - name: Lighthouse budget gate
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: studio-dist
          path: studio/frontend/dist
          retention-days: 7
